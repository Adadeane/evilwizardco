<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evil Wizard Arcade</title>
  
  <!-- Firebase Global Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    :root { --bg: #141414; --text: #fff; --muted: #808080; --brand: #e50914; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* Screen UI */
    .screen { display: none; min-height: 100vh; width: 100vw; }
    .screen.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Profile Screen */
    #profile-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
    .profiles-title { font-size: 3.5vw; font-weight: 500; margin-bottom: 1.5em; text-align: center; }
    .profile-list { display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; margin-bottom: 2.5em; }
    .profile { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; position: relative; }
    .profile-avatar { width: 10vw; height: 10vw; min-width: 90px; min-height: 90px; max-width: 150px; max-height: 150px; border-radius: 4px; border: 3px solid transparent; display: flex; align-items: [...]
    .profile-name { margin-top: 15px; font-size: 1.2vw; color: var(--muted); text-align: center; }
    .profile:hover .profile-avatar { border-color: white; }
    .profile:hover .profile-name { color: white; }
    .add-btn { background: transparent; border: 2px solid var(--muted); color: var(--muted); font-size: 4rem; }

    /* Manage Mode */
    .profile-edit-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 10vw; min-height: 90px; max-height: 150px; background: rgba(0,0,0,0.6); display: flex; align-items: center; justif[...]
    .managing .profile-edit-overlay { opacity: 1; }
    .manage-btn { background: transparent; border: 1px solid var(--muted); color: var(--muted); padding: 10px 24px; font-size: 1.1rem; letter-spacing: 2px; cursor: pointer; transition: 0.2s; }
    .manage-btn:hover { border-color: white; color: white; }

    /* Modals */
    .modal-wrap { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #222; border-radius: 8px; padding: 30px; width: 90%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-bottom: 20px; font-size: 1.5rem; color: white; }
    .modal label { display: block; font-size: 0.85rem; color: var(--muted); margin: 15px 0 5px 0; }
    .modal input[type="text"] { width: 100%; padding: 10px; background: #333; border: 1px solid #444; border-radius: 4px; color: white; font-size: 1rem; outline: none; }
    .modal input[type="file"] { width: 100%; padding: 10px; background: #333; border: 1px dashed #555; border-radius: 4px; color: white; cursor: pointer; margin-bottom: 15px; }
    .modal input[type="text"]:focus { border-color: var(--brand); }
    .modal-actions { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
    
    /* Admin Panel specifics */
    .admin-row { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
    .delete-btn { background: #333; border: 1px solid #555; color: #ff4d4d; padding: 6px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .delete-btn:hover { background: #ff4d4d; color: white; }
    .warning-box { border: 1px solid #ff4d4d; padding: 15px; border-radius: 4px; margin-top: 20px; text-align: center; }

    /* Hub Screen */
    .hub-header { padding: 20px 4%; display: flex; justify-content: space-between; background: linear-gradient(to bottom, #141414 0%, transparent 100%); position: sticky; top: 0; z-index: 100; align-i[...]
    .hub-title { font-size: 2rem; font-weight: bold; color: var(--brand); letter-spacing: 2px; }
    .header-controls { display: flex; gap: 15px; align-items: center; }
    .hub-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .hub-user-avatar { width: 35px; height: 35px; border-radius: 4px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-weight: bol[...]
    
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; padding: 20px 4% 50px 4%; }
    .game-card { background: #222; border-radius: 4px; cursor: pointer; aspect-ratio: 16/9; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; tra[...]
    .game-card:hover { transform: scale(1.08); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.2); }
    .game-emoji { font-size: 3.5rem; z-index: 2; transition: 0.2s; }
    .game-card:hover .game-emoji { transform: scale(1.2); }
    .game-title { position: absolute; bottom: 10px; left: 10px; font-weight: bold; font-size: 0.9rem; z-index: 2; text-shadow: 1px 1px 3px black; }

    /* Game View */
    .game-view { display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .game-toolbar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn, .action-btn { background: var(--brand); border: none; color: white; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .back-btn:hover, .action-btn:hover { background: #f40612; }
    
    .hidden { display: none !important; }
    .controls-hint { margin-top: 15px; color: var(--muted); text-align: center; font-size: 0.9rem; }

    /* Leaderboard specifics */
    .lb-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; font-size: 1.1rem; }
    .lb-row:nth-child(1) { color: gold; font-weight: bold; font-size: 1.3rem; }
    .lb-row:nth-child(2) { color: silver; }
    .lb-row:nth-child(3) { color: #cd7f32; }

    /* Shared Canvas & Games */
    canvas { background: #000; border: 2px solid #333; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 100%; }
    .grid-3x3 { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; background: #333; padding: 5px; border-radius: 8px; margin: 0 auto; }
    .grid-4x4 { display: grid; grid-template-columns: repeat(4, 80px); gap: 5px; background: #333; padding: 5px; border-radius: 8px; margin: 0 auto; }
    .grid-2x2 { display: grid; grid-template-columns: repeat(2, 120px); gap: 10px; margin: 0 auto; }
    
    .cell { background: #000; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 3rem; cursor: pointer; border-radius: 4px; color: white; }
    .mem-cell { height: 80px; font-size: 2rem; background: #222; }
    .whack-cell { height: 100px; background: #4caf50; transition: 0.1s; }
    .whack-cell.mole { background: #e50914; }
    
    .simon-btn { height: 120px; border-radius: 8px; opacity: 0.5; cursor: pointer; }
    .simon-btn.active { opacity: 1; box-shadow: 0 0 20px currentColor; }
    .big-btn { width: 300px; height: 300px; border-radius: 50%; border: none; background: #02bbee; color: white; font-size: 2rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0[...]
    .big-btn:active { transform: translateY(10px); box-shadow: 0 0 #018ca3; }
    .stats { font-size: 1.5rem; margin-bottom: 10px; }
    .reaction-box { width: 400px; height: 300px; background: #e50914; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; cursor: pointer; border-radius: 8[...]
    .typing-word { font-size: 3rem; margin-bottom: 20px; letter-spacing: 2px; }
    .typing-input { padding: 10px; font-size: 1.5rem; width: 300px; text-align: center; border-radius: 4px; border: none; outline: none; }

    /* MOBILE OVERRIDES */
    @media (max-width: 768px) {
      .profile-name { font-size: 16px; margin-top: 10px; }
      .profile-avatar { width: 100px; height: 100px; font-size: 3.5rem; }
      .profiles-title { font-size: 2rem; margin-bottom: 30px; }
      .profile-list { gap: 20px; }
      .manage-btn { font-size: 1rem; padding: 10px 20px; }
      .hub-header { padding: 15px 4%; }
      .hub-title { font-size: 1.5rem; }
    }
  </style>

  <!-- Fix: make profile edit overlay non-interactive unless managing mode -->
  <style>
    /* Allow clicks to pass through overlay when not managing so profile click works */
    .profile-edit-overlay { opacity: 0; transition: opacity 0.18s ease; pointer-events: none; }
    .managing .profile-edit-overlay { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>

  <!-- PROFILE SCREEN -->
  <div id="profile-screen" class="screen active">
    <h1 class="profiles-title" id="profile-heading">Connecting to Cloud...</h1>
    <div class="profile-list" id="profile-list"></div>
    <button class="manage-btn hidden" id="manage-toggle-btn" onclick="toggleManageMode()">MANAGE PROFILES</button>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div id="edit-modal" class="modal-wrap hidden">
    <div class="modal">
      <h2>Edit Profile</h2>
      <label>Profile Name</label>
      <input type="text" id="edit-name" placeholder="Name">
      <label>Background Color (Hex Code)</label>
      <input type="text" id="edit-color" placeholder="#e50914">
      
      <label>Upload Avatar Image (100% Free)</label>
      <input type="file" id="edit-file" accept="image/png, image/jpeg, image/gif">
      
      <label>Or use Image URL</label>
      <input type="text" id="edit-img" placeholder="https://example.com/avatar.png">
      
      <div class="modal-actions" style="justify-content: flex-end;">
        <button class="action-btn" style="background:#555;" onclick="closeModal('edit-modal')">Cancel</button>
        <button class="action-btn" id="save-prof-btn" onclick="saveProfileChanges()">Save Profile</button>
      </div>
    </div>
  </div>

  <!-- ADMIN PANEL MODAL -->
  <div id="admin-modal" class="modal-wrap hidden">
    <div class="modal">
      <h2>⚙️ Adam's Admin Panel</h2>
      <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 15px;">Manage arcade users and database.</p>
      
      <div id="admin-profiles-list" style="margin-bottom: 20px;">
        <!-- Loaded via JS -->
      </div>

      <div class="warning-box">
        <h3 style="color: #ff4d4d; margin-bottom: 10px;">Danger Zone</h3>
        <button class="delete-btn" style="width: 100%;" onclick="adminWipeLeaderboards()">WIPE ALL LEADERBOARDS</button>
      </div>

      <div class="modal-actions" style="justify-content: flex-end; margin-top: 20px;">
        <button class="action-btn" onclick="closeModal('admin-modal')">Close Panel</button>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD MODAL -->
  <div id="lb-modal" class="modal-wrap hidden">
    <div class="modal">
      <h2 id="lb-title">Global Top Scores</h2>
      <div id="lb-content" style="min-height: 150px; margin-bottom: 20px;">Loading scores...</div>
      <div style="text-align: right;">
        <button class="action-btn" onclick="closeModal('lb-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- HUB SCREEN -->
  <div id="hub-screen" class="screen">
    <div class="hub-header">
      <div class="hub-title">EVIL WIZARD</div>
      <div class="header-controls">
        <button class="action-btn hidden" id="admin-btn" style="background: #8c00ff;" onclick="openAdminPanel()">⚙️ Admin</button>
        <div class="hub-user" onclick="switchScreen('profile-screen')">
          <span id="current-user-name">Player</span>
          <div id="current-user-avatar" class="hub-user-avatar"></div>
        </div>
      </div>
    </div>
    <div class="game-grid" id="playable-grid"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div class="game-view">
      <div class="game-toolbar">
        <button class="back-btn" onclick="exitGame()">← Back to Hub</button>
        <h2 id="active-game-title">Game Title</h2>
        <button class="action-btn" style="background: #e4b61a; color: black;" onclick="showLeaderboard()">🏆 Leaderboard</button>
      </div>

      <div id="game-canvas-wrap" class="game-container hidden">
        <canvas id="cvs"></canvas>
        <div id="cvs-hint" class="controls-hint"></div>
      </div>

      <!-- Games DOM -->
      <div id="game-ttt" class="game-container hidden"><div class="grid-3x3" id="ttt-board"></div><div id="ttt-status" class="controls-hint" style="font-size: 1.2rem; color: white;">Your turn! (X)</di[...]
      <div id="game-memory" class="game-container hidden"><div class="grid-4x4" id="mem-board"></div><div id="mem-status" class="controls-hint">Matches: 0/8</div></div>
      <div id="game-whack" class="game-container hidden"><div class="stats" id="whack-score">Score: 0 | Time: 30</div><div class="grid-3x3" id="whack-board"></div></div>
      <div id="game-simon" class="game-container hidden">
        <div class="stats" id="simon-score">Level: 1</div>
        <div class="grid-2x2">
          <div class="simon-btn" style="background:red;" id="simon-0" onclick="simonClick(0)"></div><div class="simon-btn" style="background:green;" id="simon-1" onclick="simonClick(1)"></div>
          <div class="simon-btn" style="background:blue;" id="simon-2" onclick="simonClick(2)"></div><div class="simon-btn" style="background:yellow;" id="simon-3" onclick="simonClick(3)"></div>
        </div>
      </div>
      <div id="game-clicker" class="game-container hidden" style="text-align: center;"><div class="stats" id="clicker-score">Cash: $0</div><button class="big-btn" onclick="clickerAdd()">CLICK ME</butt[...]
      <div id="game-reaction" class="game-container hidden"><div class="reaction-box" id="reaction-box" onclick="reactionClick()">Click to Start</div><div id="reaction-score" class="controls-hint"></d[...]
      <div id="game-typing" class="game-container hidden" style="text-align: center;"><div class="stats" id="typing-stats">Score: 0 | Time: 60</div><div class="typing-word" id="typing-word">ready</div[...]
    </div>
  </div>

  <script>
    // ==========================================
    // FIREBASE SETUP
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBVEFPRRfC9km-OlD7bFlJ576rn04DKGLg",
      authDomain: "wizard-co-537bf.firebaseapp.com",
      projectId: "wizard-co-537bf",
      messagingSenderId: "36260203502",
      appId: "1:36260203502:web:fd0cf34bfd13dea3ab1cff"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // SYSTEM & PROFILE ENGINE
    // ==========================================
    const colors = ['#e50914', '#02bbee', '#e4b61a', '#30a13d', '#8c00ff'];
    let profiles = [];
    let activeProfile = null;
    let editingProfileId = null;
    let isManaging = false;
    let activeGameId = null;
    let loopInt, logicInt;
    let keys = {};

    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');
    let ptr = {x:0, y:0, click:false};
    cvs.onmousedown = e => { let r=cvs.getBoundingClientRect(); ptr.x=e.clientX-r.left; ptr.y=e.clientY-r.top; ptr.click=true; };

    // Fetch Profiles
    db.collection("profiles").onSnapshot((snapshot) => {
      if(snapshot.empty) {
        db.collection("profiles").add({ name: 'Adam', color: '#e50914', img: '' });
      } else {
        profiles = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        document.getElementById('profile-heading').innerText = isManaging ? 'Manage Profiles:' : "Who's playing?";
        document.getElementById('manage-toggle-btn').classList.remove('hidden');
        renderProfiles();
        
        if (!document.getElementById('admin-modal').classList.contains('hidden')) {
          renderAdminProfiles();
        }
      }
    });

    function renderProfiles() {
      const list = document.getElementById('profile-list');
      const container = document.getElementById('profile-screen');
      if (isManaging) container.classList.add('managing'); else container.classList.remove('managing');

      list.innerHTML = profiles.map(p => {
        const bgStyle = p.img ? `background-image: url('${p.img}');` : `background-color: ${p.color || '#e50914'};`;
        const initial = p.img ? '' : p.name[0].toUpperCase();
        return `<div class="profile" onclick="handleProfileClick('${p.id}')">
            <div class="profile-avatar" style="${bgStyle}">${initial}</div>
            <div class="profile-edit-overlay">✏️</div>
            <div class="profile-name">${p.name}</div>
          </div>`;
      }).join('');

      if (profiles.length < 5 && !isManaging) {
        list.innerHTML += `<div class="profile" onclick="addP()"><div class="profile-avatar add-btn">+</div><div class="profile-name">Add Profile</div></div>`;
      }
    }

    function toggleManageMode() {
      isManaging = !isManaging;
      document.getElementById('profile-heading').innerText = isManaging ? 'Manage Profiles:' : "Who's playing?";
      document.getElementById('manage-toggle-btn').innerText = isManaging ? 'DONE' : 'MANAGE PROFILES';
      renderProfiles();
    }

    function handleProfileClick(id) {
      if (isManaging) {
        openEditModal(id);
      } else {
        const p = profiles.find(item => item.id === id);
        if (p.name.toLowerCase() === 'adam') {
          const pin = prompt("Enter PIN:");
          if (pin === null || pin.trim() !== "8888") { alert("Incorrect PIN! Access Denied."); return; }
        }
        enterArcadeHub(id);
      }
    }

    async function addP() {
      let n = prompt("Profile Name:");
      if (n && n.trim()) {
        const nameClean = n.trim();
        if (nameClean.toLowerCase() === 'adam' && profiles.some(pr => pr.name.toLowerCase() === 'adam')) {
          alert("The name 'Adam' is reserved for the Admin."); return;
        }
        await db.collection("profiles").add({ name: nameClean, color: colors[profiles.length % colors.length], img: '' });
      }
    }

    function openEditModal(id) {
      editingProfileId = id;
      const p = profiles.find(item => item.id === id);
      if (!p) return;
      document.getElementById('edit-name').value = p.name;
      document.getElementById('edit-color').value = p.color || '#e50914';
      document.getElementById('edit-img').value = p.img || '';
      document.getElementById('edit-file').value = ""; 
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeModal(modalId) { 
      document.getElementById(modalId).classList.add('hidden'); 
      if (modalId === 'edit-modal') editingProfileId = null; 
    }

    async function saveProfileChanges() {
      const p = profiles.find(item => item.id === editingProfileId);
      if (!p) return;

      const btn = document.getElementById('save-prof-btn');
      btn.innerText = "Saving (Freezing image)...";
      btn.disabled = true;

      const newName = document.getElementById('edit-name').value.trim();
      const newColor = document.getElementById('edit-color').value.trim();
      const fileInput = document.getElementById('edit-file').files[0];
      let newImgUrl = document.getElementById('edit-img').value.trim();

      try {
        let finalImg = newImgUrl || p.img;

        if (fileInput) {
          finalImg = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_SIZE = 150; 
                canvas.width = MAX_SIZE;
                canvas.height = MAX_SIZE;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = "#333";
                ctx.fillRect(0, 0, MAX_SIZE, MAX_SIZE);
                const scale = Math.max(MAX_SIZE / img.width, MAX_SIZE / img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                const x = (MAX_SIZE / 2) - (w / 2);
                const y = (MAX_SIZE / 2) - (h / 2);
                
                ctx.drawImage(img, x, y, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
              };
              img.src = e.target.result;
            };
            reader.readAsDataURL(fileInput);
          });
        }

        await db.collection("profiles").doc(editingProfileId).set({ 
          name: newName || p.name, 
          color: newColor.startsWith('#') ? newColor : `#${newColor}`, 
          img: finalImg 
        }, { merge: true });

      } catch (err) {
        console.error(err);
        alert("Upload failed! Image might be corrupted.");
      }

      btn.innerText = "Save Profile";
      btn.disabled = false;
      closeModal('edit-modal');
    }

    function enterArcadeHub(id) {
      activeProfile = profiles.find(p => p.id === id);
      if (!activeProfile) return;

      document.getElementById('current-user-name').innerText = activeProfile.name;
      
      if (activeProfile.name.toLowerCase() === 'adam') {
        document.getElementById('admin-btn').classList.remove('hidden');
      } else {
        document.getElementById('admin-btn').classList.add('hidden');
      }

      const avatarEl = document.getElementById('current-user-avatar');
      if (activeProfile.img && activeProfile.img.length > 5) {
        avatarEl.style.backgroundImage = `url('${activeProfile.img}')`;
        avatarEl.style.backgroundColor = 'transparent';
        avatarEl.innerText = '';
      } else {
        avatarEl.style.backgroundImage = 'none';
        avatarEl.style.backgroundColor = activeProfile.color || '#e50914';
        avatarEl.innerText = (activeProfile.name[0] || '?').toUpperCase();
      }
      switchScreen('hub-screen');
    }

    function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    // ==========================================
    // ADMIN PANEL ENGINE
    // ==========================================
    function openAdminPanel() {
      if (activeProfile.name.toLowerCase() !== 'adam') return;
      const pin = prompt("Confirm Admin PIN:");
      if (pin === null || pin.trim() !== "8888") { alert("Access Denied!"); return; }
      document.getElementById('admin-modal').classList.remove('hidden');
      renderAdminProfiles();
    }

    function renderAdminProfiles() {
      const list = document.getElementById('admin-profiles-list');
      list.innerHTML = profiles.map(p => {
        if (p.name.toLowerCase() === 'adam') {
          return `<div class="admin-row"><span><strong>${p.name}</strong> (Admin)</span> <span style="color:var(--muted); font-size:0.8rem;">Undeletable</span></div>`;
        } else {
          return `<div class="admin-row"><span>${p.name}</span> <button class="delete-btn" onclick="adminDeleteProfile('${p.id}')">Delete</button></div>`;
        }
      }).join('');
    }

    async function adminDeleteProfile(id) {
      if (confirm("Are you sure you want to permanently delete this profile?")) {
        await db.collection("profiles").doc(id).delete();
      }
    }

    async function adminWipeLeaderboards() {
      if (prompt("Type WIPE to delete all global high scores permanently.") !== "WIPE") return;
      const snap = await db.collection("scores").get();
      snap.forEach(doc => { db.collection("scores").doc(doc.id).delete(); });

    }

    // CLOUD LEADERBOARD ENGINE
    // ==========================================
    async function submitScore(gameId, score) {
      if(!activeProfile) return;
      const docRef = db.collection("scores").doc(`${activeProfile.id}_${gameId}`);
      const snap = await docRef.get();
      let isNewHigh = false;
      
      if(snap.exists) {
        let oldScore = snap.data().score;
        if(gameId === 'reaction') { if(score < oldScore) isNewHigh = true; } 
        else { if(score > oldScore) isNewHigh = true; }
      } else {
        isNewHigh = true;
      }

      if(isNewHigh) {
        await docRef.set({ profileId: activeProfile.id, name: activeProfile.name, gameId: gameId, score: score, timestamp: Date.now() });
      }
    }

    async function showLeaderboard() {
      document.getElementById('lb-modal').classList.remove('hidden');
      const content = document.getElementById('lb-content');
      content.innerHTML = 'Fetching from cloud...';
      
      const snap = await db.collection("scores").where("gameId", "==", activeGameId).get();
      let scores = snap.docs.map(d=>d.data());
      
      if(activeGameId === 'reaction') scores.sort((a,b)=> a.score - b.score);
      else scores.sort((a,b)=> b.score - a.score);
      
      scores = scores.slice(0, 10);
      if(scores.length === 0) { content.innerHTML = '<div style="color:var(--muted);text-align:center;margin-top:20px;">No scores recorded yet!</div>'; } 
      else {
        content.innerHTML = scores.map((s,i) => `
          <div class="lb-row">
            <span>${i+1}. ${s.name}</span>
            <span>${s.score}${activeGameId==='reaction'?'ms':''}</span>
          </div>
        `).join('');
      }
    }
